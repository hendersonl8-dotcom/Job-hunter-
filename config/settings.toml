# Job Hunter settings. Secrets (the USAJobs key) go in environment variables, not here.

[paths]
database = "data/jobs.db"
profile = "config/profile.json"

[usajobs]
# One search per keyword. Set USAJOBS_API_KEY and USAJOBS_EMAIL to turn this on.
keywords = ["information technology specialist", "system administrator", "data analyst", "program analyst", "project manager", "quality assurance"]
location = "Seattle, Washington"
radius_miles = 60

[boards]
# Company job boards to pull from. The name is the last part of the company's
# careers URL: boards.greenhouse.io/<name> or jobs.lever.co/<name>.
# Add Seattle-area companies you find; a wrong name just shows an error for that board.
greenhouse = []
lever = []
