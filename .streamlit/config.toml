[server]
# Skips Streamlit's first-run email prompt, which otherwise stops the app from starting.
headless = true

[client]
# Hides Streamlit's developer menu and "Deploy" button so it looks like an app, not a dev tool.
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#0F766E"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F1F5F9"
textColor = "#0F172A"
font = "sans serif"
