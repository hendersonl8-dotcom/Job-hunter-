name: Windows installer

on:
  pull_request:
    paths: [ "desktop.py", "app.py", "job_hunter/**", "assets/**", ".streamlit/**", "packaging/**", "requirements.txt", ".github/workflows/windows-installer.yml" ]
  workflow_dispatch:

permissions:
  contents: write  # lets a manual run publish the installer as a GitHub Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File packaging\build.ps1
      - name: Packaged app runs the real app script
        shell: pwsh
        run: |
          $p = Start-Process dist\JobHunter\JobHunter.exe -ArgumentList "--check" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "app.py failed to load in the packaged app (exit $($p.ExitCode))" }
      - name: Smoke test the packaged app starts its server
        shell: pwsh
        run: |
          $p = Start-Process dist\JobHunter\JobHunter.exe -PassThru
          Start-Sleep -Seconds 45
          if ($p.HasExited) { throw "JobHunter.exe exited early with code $($p.ExitCode)" }
          $port = (Get-NetTCPConnection -State Listen -OwningProcess (Get-CimInstance Win32_Process | Where-Object ParentProcessId -eq $p.Id).ProcessId -ErrorAction SilentlyContinue).LocalPort | Select-Object -First 1
          if (-not $port) { throw "No server listening" }
          Invoke-WebRequest "http://127.0.0.1:$port/_stcore/health" -UseBasicParsing | Out-Null
          Stop-Process -Id $p.Id -Force
      - uses: actions/upload-artifact@v4
        with:
          name: JobHunter-Setup
          path: installer/JobHunter-Setup.exe
      - name: Publish a GitHub Release (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "installer-$($env:GITHUB_RUN_NUMBER)"
          gh release create $tag installer/JobHunter-Setup.exe --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Job Hunter installer $($env:GITHUB_RUN_NUMBER)" --notes "Windows installer built from commit $($env:GITHUB_SHA.Substring(0,7)). Download JobHunter-Setup.exe below, double-click it, and see the README's Share this app section."
